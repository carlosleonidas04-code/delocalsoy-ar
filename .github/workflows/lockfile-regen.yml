# Workflow desechable (LOCKFILE-REGEN): regenera pnpm-lock.yaml con pnpm real.
# Motivo (R3, 2026-10-28): el lockfile quedo desactualizado respecto de
# apps/web/package.json (firebase, @google/genai, @vis.gl/react-google-maps,
# recharts, ws, @types/ws y, tras #238, lucide-react). Prerequisito para
# AUD-09 (#235, frozen-lockfile). Nada se simula (R15): el lockfile debe
# salir de un pnpm install real.
# v2 (2026-11-03): trigger push en chore/lockfile-regen-auto y main, sin
# paso manual. Resultado: el push d6e21862 (21:00:41Z) NO produjo
# chore/lockfile-regenado en >17 min (timeout 15 min) - fallo o no-disparo,
# sin visibilidad (el conector no tiene API de Actions).
# v3 (2026-11-03): + trigger pull_request (eventos PR del conector probados
# en CI), + issue de diagnostico #350 como canal observable: el workflow
# comenta inicio/OK/fallo en #350. Borrar este workflow tras completar AUD-09.

name: Lockfile regen

on:
  workflow_dispatch:
  push:
    branches:
      - chore/lockfile-regen-auto
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write

concurrency:
  group: lockfile-regen
  cancel-in-progress: false

timeout-minutes: 20

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Reportar inicio (diagnostico #350)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 350 --body "**run iniciado** - evento: ${{ github.event_name }}, ref: ${{ github.ref_name }}, sha: ${{ github.sha }} ($(date -u +%FT%TZ))"

      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm (packageManager: pnpm@9.0.0)
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerar pnpm-lock.yaml
        run: |
          set -o pipefail
          pnpm install --lockfile-only --no-frozen-lockfile 2>&1 | tee regen.log

      - name: Verificar frozen-lockfile (precondicion AUD-09 #235)
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee verify.log

      - name: Push a chore/lockfile-regenado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/lockfile-regenado
          git add pnpm-lock.yaml
          git commit -m "chore: pnpm-lock.yaml regenerado (apps/web: firebase, genai, maps, recharts, ws, lucide-react)" || echo "Sin cambios: lockfile ya al dia"
          git push origin chore/lockfile-regenado --force

      - name: Reportar exito (#350)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 350 --body "**regen OK** - chore/lockfile-regenado empujada en $(git rev-parse --short chore/lockfile-regenado)"

      - name: Reportar fallo con logs (#350)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**FALLO del regen** - evento: ${{ github.event_name }}, ref: ${{ github.ref_name }}"
            echo ""
            echo '~~~'
            tail -n 60 regen.log 2>/dev/null || true
            echo "---"
            tail -n 60 verify.log 2>/dev/null || true
            echo '~~~'
          } > /tmp/fallo.md || true
          gh issue comment 350 --body-file /tmp/fallo.md || gh issue comment 350 --body "**FALLO del regen** (sin logs disponibles)"
