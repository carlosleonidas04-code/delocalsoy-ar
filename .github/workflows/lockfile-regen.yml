# Workflow desechable (LOCKFILE-REGEN): regenera pnpm-lock.yaml con pnpm real.
# Motivo (R3, 2026-10-28): el lockfile quedo desactualizado respecto de
# apps/web/package.json (firebase, @google/genai, @vis.gl/react-google-maps,
# recharts, ws, @types/ws y, tras #238, lucide-react). Prerequisito para
# AUD-09 (#235, frozen-lockfile). Nada se simula (R15): el lockfile debe
# salir de un pnpm install real.
# v2 (2026-11-03, AUD-09 v2): ademas de workflow_dispatch, trigger push en
# chore/lockfile-regen-auto y main — el regen corre SOLO al push, sin paso
# manual (la DH no logro disparar el dispatch; el push de esta misma rama
# auto-ejecuta el regen contra este arbol = main actual + lucide-react).
# El job verifica --frozen-lockfile y hace push a chore/lockfile-regenado
# (se abre PR propio para el lockfile resultante). Borrar este workflow tras
# completar AUD-09.

name: Lockfile regen

on:
  workflow_dispatch:
  push:
    branches:
      - chore/lockfile-regen-auto
      - main

permissions:
  contents: write

concurrency:
  group: lockfile-regen
  cancel-in-progress: false

timeout-minutes: 15

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm (packageManager: pnpm@9.0.0)
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerar pnpm-lock.yaml
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verificar frozen-lockfile (precondicion AUD-09 #235)
        run: pnpm install --frozen-lockfile

      - name: Push a chore/lockfile-regenado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/lockfile-regenado
          git add pnpm-lock.yaml
          git commit -m "chore: pnpm-lock.yaml regenerado (apps/web: firebase, genai, maps, recharts, ws, lucide-react)" || echo "Sin cambios: lockfile ya al dia"
          git push origin chore/lockfile-regenado --force