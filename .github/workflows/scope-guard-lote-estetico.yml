# Guard invertido de alcance estético (ADR-034 §4.5) — informe R12 (2ª ronda) de [agent: anthropic].
# Reemplaza al guard por label: corre SIEMPRE y falla por defecto si un PR mezcla
# diseño con lógica, salvo label explícito "mixto-r9" (fricción invertida: el permiso es lo excepcional).
# Código ejecutable VERBATIM del borrador del auditor (revisa puntos a/b/c antes de RA2-c);
# solo este header de comentarios es añadido (divulgado, R4/R12). Evidencia RA2-c: ver el PR de aterrizaje.

name: scope-guard-lote-estetico
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  scope:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Diseño no se mezcla con lógica (ADR-034 §4.5)
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          MIXTO: ${{ contains(github.event.pull_request.labels.*.name, 'mixto-r9') }}
        run: |
          set -euo pipefail
          allow='^(apps/web/src/design/|apps/web/src/styles\.css$|apps/web/index\.html$)'
          files=$(git diff --name-only "origin/${BASE}...HEAD")
          design=$(echo "$files" | grep -E  "$allow" || true)
          other=$(echo "$files"  | grep -Ev "$allow" || true)
          if [[ "$HEAD_REF" == agent-google/* && -n "$other" ]]; then
            echo "Rama agent-google con archivos fuera de alcance:"; echo "$other"; exit 1
          fi
          if [[ -n "$design" && -n "$other" && "$MIXTO" != "true" ]]; then
            echo "PR mezcla diseño y lógica sin label mixto-r9:"; echo "$other"; exit 1
          fi