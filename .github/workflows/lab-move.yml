name: "Lab move PR-1 (/lab)"

on:
  push:
    branches: ["chore/lab-move-agent"]

permissions:
  contents: write
  issues: write

concurrency:
  group: lab-move
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: "356"
    steps:
      - name: "Reportar inicio en el issue de traza"
        run: gh issue comment "$ISSUE_NUMBER" --body "Iniciado el lab-move (run $GITHUB_RUN_ID, commit ${GITHUB_SHA::7}): checkout, install, transform + move de 27 modulos lab, gate typecheck y push a chore/lab-moved." || true
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: "Instalar dependencias (lockfile congelado)"
        run: pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: "Transformar, mover y verificar (gate typecheck)"
        run: bash scripts/lab-move/move.sh 2>&1 | tee move.log
      - name: "Limpiar staging (scripts y este workflow no llegan a la rama final)"
        run: |
          git rm -r -q scripts/lab-move
          git rm -q .github/workflows/lab-move.yml
      - name: "Commit y push a chore/lab-moved"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "refactor(web): mover 27 modulos lab + canvas-maestro a src/lab/ (/lab PR-1)" \
            -m "- App.tsx: 22 imports estaticos lab -> React.lazy + Suspense fallback null
- TopBarHeader (producto): marca desde lib/DelocalSoyBrand (extraccion 1:1 del prototipo)
- delete design/BaseConsolidadaPrototype.tsx (duplicado muerto, #352)
- gate: pnpm --filter @delocalsoy/web typecheck verde

Refs: issue de traza #356, #352"
          git push --force origin HEAD:refs/heads/chore/lab-moved
      - name: "Reportar exito en el issue de traza"
        if: success()
        run: gh issue comment "$ISSUE_NUMBER" --body "Lab-move exitoso (run $GITHUB_RUN_ID): rama chore/lab-moved actualizada con el arbol de main + refactor y typecheck verde. Listo para abrir el PR hacia main." || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: "Reportar fallo en el issue de traza"
        if: failure()
        run: |
          {
            echo "FALLO del lab-move (run $GITHUB_RUN_ID)."
            echo
            echo "Ultimas lineas de move.log:"
            echo '```'
            tail -n 100 move.log 2>/dev/null || echo "(sin move.log)"
            echo '```'
            echo
            echo "Ultimas lineas de install.log:"
            echo '```'
            tail -n 30 install.log 2>/dev/null || echo "(sin install.log)"
            echo '```'
          } > /tmp/lab-move-fail.md || true
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/lab-move-fail.md || true
        env:
          GH_TOKEN: ${{ github.token }}
