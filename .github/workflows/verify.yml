name: verify

# Compuerta de acreditacion (T2-R15-02) — v8: auto-report con job correcto.
# v7 publicaba el comentario pero no encontraba el job: `context.job` es el NOMBRE
# del job ('build'), no su ID numerico -> find por id nunca matcheaba y
# downloadJobLogs devolvia 404. v8 matchea por nombre y usa el id real.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnostico (estado del workspace antes del install)
        run: |
          ls -la
          cat pnpm-workspace.yaml
          pnpm --version
          node -e "console.log('node ok')"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Prisma generate (EV-003)
        run: pnpm --filter @delocalsoy/db db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      - name: Build monorepo (EV-006)
        run: pnpm turbo run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      - name: Auto-report del fallo al PR (R4)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            let failedInfo = 'desconocido';
            let logText = '';
            try {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
              });
              // context.job es el NOMBRE del job ('build'), no su id.
              const job = jobs.jobs.find(j => j.name === context.job)
                || jobs.jobs.find(j => j.conclusion === 'failure')
                || jobs.jobs[0];
              if (job) {
                failedInfo = job.steps
                  .filter(s => s.conclusion === 'failure')
                  .map(s => s.name)
                  .join(', ') || '(ningun paso marcado en fallo)';
                const res = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, job_id: job.id
                });
                logText = typeof res.data === 'string'
                  ? res.data
                  : Buffer.from(res.data).toString('utf8');
              } else {
                failedInfo = 'no hay jobs en el run';
              }
            } catch (e) {
              failedInfo = failedInfo === 'desconocido' ? ('fallo al listar jobs: ' + e.message) : failedInfo;
              logText = 'no se pudo descargar el log: ' + e.message;
            }
            const tail = logText.slice(-4500);
            const body = '## \u{1F534} Compuerta auto-report (R4) — pasos en fallo: ' + failedInfo + '\n\nUltimas lineas del log del job:\n\n```\n' + tail + '\n```\n\n*auto-report del workflow `verify` — la salida real acredita (R4), nada se cierra sin ella.*';
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
              core.info('auto-report publicado en el PR');
            } catch (e) {
              core.setFailed('createComment fallo: ' + e.message);
            }
