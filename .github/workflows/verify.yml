name: verify

# Compuerta de acreditacion (T2-R15-02) — endurecida tras diagnostico P1:
# en runners ubuntu-latest, @prisma/client no resolvia sin shamefully-hoist
# y pnpm install --no-frozen-lockfile, y db:generate necesita DATABASE_URL.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies (resolucion @prisma/client)
        run: pnpm install --no-frozen-lockfile --config.shamefully-hoist=true --config.link-workspace-packages=true
      - name: Prisma generate (EV-003)
        run: pnpm turbo run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      - name: Build monorepo (EV-006)
        run: pnpm turbo run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
