name: verify

# Compuerta de acreditacion (T2-R15-02) — v7: auto-report funcional.
# v6 fallaba en silencio: declarar `permissions` a nivel de workflow deixa TODAS
# las demas scopes en `none` -> listJobs/downloadLogs (actions: read) devolvian 403
# y el script moria antes de publicar el comentario. v7 anade actions: read y
# blinda el script para que el comentario se publique pase lo que pase (R4).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnostico (estado del workspace antes del install)
        run: |
          ls -la
          cat pnpm-workspace.yaml
          pnpm --version
          node -e "console.log('node ok')"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Prisma generate (EV-003)
        run: pnpm --filter @delocalsoy/db db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      - name: Build monorepo (EV-006)
        run: pnpm turbo run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      - name: Auto-report del fallo al PR (R4)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            let failedInfo = 'desconocido';
            let logText = '';
            try {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
              });
              const job = jobs.jobs.find(j => j.id === context.job);
              failedInfo = job
                ? job.steps.filter(s => s.conclusion === 'failure').map(s => s.name).join(', ')
                : 'job no encontrado en la lista';
            } catch (e) {
              failedInfo = 'listJobs fallo: ' + e.message;
            }
            try {
              const res = await github.rest.actions.downloadJobLogsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, job_id: context.job
              });
              logText = typeof res.data === 'string'
                ? res.data
                : Buffer.from(res.data).toString('utf8');
            } catch (e) {
              logText = 'no se pudo descargar el log: ' + e.message;
            }
            const tail = logText.slice(-4500);
            const body = '## \u{1F534} Compuerta auto-report (R4) — pasos en fallo: ' + failedInfo + '\n\nUltimas lineas del log del job:\n\n```\n' + tail + '\n```\n\n*auto-report del workflow `verify` — la salida real acredita (R4), nada se cierra sin ella.*';
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
              core.info('auto-report publicado en el PR');
            } catch (e) {
              core.setFailed('createComment fallo: ' + e.message);
            }
