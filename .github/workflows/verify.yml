name: verify

# Compuerta de acreditacion (T2-R15-02) — v5 tras diagnostico P4/P5 del 2026-10-06.
# v5: install minimo canonico (sin flags opcionales — los flags heredados del P1
# nunca fueron validados porque todos los runs anteriores morian en el setup).
# P2 (lockfile ausente -> sin cache:pnpm) y P3 (version pnpm explicita) ya resueltos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnostico (estado del workspace antes del install)
        run: |
          ls -la
          cat pnpm-workspace.yaml
          node -e "console.log('node ok')"
          pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Prisma generate (EV-003)
        run: pnpm --filter @delocalsoy/db db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      - name: Build monorepo (EV-006)
        run: pnpm turbo run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
