name: verify

# Compuerta de acreditacion (T2-R15-02) — v9.
# P6 (hallazgo del auto-report v8): el paso que fallaba era actions/checkout —
# el bloque `permissions` de v6-v8 omitia `contents`, que queda en `none` ->
# el token no poda leer el repo. Se anade contents: read.
# Logs por paso (tee) para que el auto-report publique la salida real.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnostico (estado del workspace antes del install)
        run: |
          ls -la
          cat pnpm-workspace.yaml
          pnpm --version
          node -e "console.log('node ok')"
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee install.log
      - name: Prisma generate (EV-003)
        run: |
          set -o pipefail
          pnpm --filter @delocalsoy/db db:generate 2>&1 | tee generate.log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      - name: Build monorepo (EV-006)
        run: |
          set -o pipefail
          pnpm turbo run build 2>&1 | tee build.log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      - name: Auto-report del fallo al PR (R4)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            let failedInfo = 'desconocido';
            let logText = '';
            try {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
              });
              const job = jobs.jobs.find(j => j.name === context.job)
                || jobs.jobs.find(j => j.conclusion === 'failure')
                || jobs.jobs[0];
              if (job) {
                failedInfo = job.steps
                  .filter(s => s.conclusion === 'failure')
                  .map(s => s.name)
                  .join(', ') || '(ningun paso marcado en fallo)';
              } else {
                failedInfo = 'no hay jobs en el run';
              }
            } catch (e) {
              failedInfo = 'fallo al listar jobs: ' + e.message;
            }
            // Logs reales del workspace (tee por paso): mas fiable que la API
            // (que falla con 'Unknown error' mientras el job esta en curso).
            try {
              const fs = require('fs');
              for (const f of ['install.log', 'generate.log', 'build.log']) {
                if (fs.existsSync(f)) {
                  const t = fs.readFileSync(f, 'utf8');
                  logText += '===== ' + f + ' (ultimas lineas) =====' + '\n' + t.slice(-2500) + '\n\n';
                }
              }
            } catch (e) {
              logText += 'fallo al leer logs locales: ' + e.message + '\n';
            }
            if (!logText) {
              try {
                const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
                });
                const job = jobs.jobs.find(j => j.name === context.job) || jobs.jobs[0];
                if (job) {
                  const res = await github.rest.actions.downloadJobLogsForWorkflowRun({
                    owner: context.repo.owner, repo: context.repo.repo, job_id: job.id
                  });
                  logText = typeof res.data === 'string'
                    ? res.data
                    : Buffer.from(res.data).toString('utf8');
                }
              } catch (e) {
                logText = 'sin logs locales y fallo la API: ' + e.message;
              }
            }
            const tail = logText.slice(-4500);
            const body = '## \u{1F534} Auto-report (R4, workflow ' + context.workflow + ') — pasos en fallo: ' + failedInfo + '\n\nLog del job:\n\n```\n' + tail + '\n```\n\n*La salida real acredita (R4): nada se cierra sin ella.*';
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
              core.info('auto-report publicado en el PR');
            } catch (e) {
              core.setFailed('createComment fallo: ' + e.message);
            }
