name: verify

# Compuerta de acreditacion (T2-R15-02) — v4 tras diagnostico P4 del 2026-10-06.
# P4: apps/api declaraba "@delocalsoy/db": "*" (68a8872) -> pnpm lo busca en el
# registry publico y falla en segundos (no existe fuera del monorepo).
# Fix: protocolo workspace:* (pnpm siempre lo resuelve al workspace, sin flags)
# + flags de install en forma directa (no --config.).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Sin cache: pnpm hasta que se commitee un pnpm-lock.yaml.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --shamefully-hoist=true --link-workspace-packages=true
      - name: Prisma generate (EV-003)
        run: pnpm --filter @delocalsoy/db db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      - name: Build monorepo (EV-006)
        run: pnpm turbo run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
